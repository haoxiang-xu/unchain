[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unchain"
version = "0.2.0"
description = "Unchain Harness: a lightweight Python agent builder for tool-using runtimes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.87.0",
    "google-genai>=1.68.0",
    "httpx>=0.28.1",
    "mcp>=1.30.0,<2.0.0",
    "openai>=2.7.1",
    "platformdirs>=4.4.0",
    "tree-sitter>=0.21.3,<0.22",
    "tree-sitter-languages>=1.10.2,<2",
    # Security floors also apply to pip/editable installs, which do not read uv.lock.
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    # Keep Intel macOS and 32-bit Windows support; cryptography 49 drops both.
    # Defer GHSA-g6cj-pr64-35w5, GHSA-jwv3-5hgf-82ww and GHSA-m2h6-j472-rp4c.
    "cryptography>=48.0.1,<49",
    "idna>=3.15",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "PyJWT>=2.15.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
]

[project.scripts]
unchain-repl = "unchain.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.9.0",
    "h2>=4.4.1",
    "hpack>=4.2.0",
    "Pygments>=2.20.0",
]
render = [
    "rich>=13",
    "Pygments>=2.20.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unchain = [
    "memory/toolkit/README.md",
    "runtime/resources/*.json",
    "toolkits/builtin/*/toolkit.toml",
    "toolkits/builtin/*/README.md",
    "toolkits/builtin/*/*.svg",
    "toolkits/builtin/*/*.png",
]

[tool.pytest.ini_options]
markers = ["live_provider: opt-in credentialed provider qualification"]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".venv",
    "tests/evals/fixtures",
]
