name: Unchain CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.12 full suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Unchain
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check provider authentication and protocol boundaries first
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q tests/test_skeleton_kernel_auth.py tests/test_skeleton_runtime_protocol.py tests/test_skeleton_hook_tool_sets.py

      - name: Run full test suite
        env:
          PYTHONPATH: src:.
        run: python -m pytest -q
