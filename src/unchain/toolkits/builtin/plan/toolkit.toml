[toolkit]
id = "plan"
name = "Plan"
description = "Workspace-backed planning tools for drafting, updating, reading, listing, and finalizing structured plans."
factory = "unchain.toolkits.builtin.plan:PlanToolkit"
version = "1.0.0"
readme = "README.md"
icon = "icon.svg"
color = "#2563eb"
backgroundcolor = "#bfdbfe"
tags = ["builtin", "planning", "workflow"]

[display]
category = "builtin"
order = 20
hidden = false

[compat]
python = ">=3.9"
legacy = ">=0"

[[tools]]
name = "plan_start"
title = "Plan Start"
description = "Create a new draft plan and return its plan_id."
observe = false
requires_confirmation = false

[[tools]]
name = "plan_update"
title = "Plan Update"
description = "Replace structured sections of a draft plan such as summary, steps, tests, assumptions, and references."
observe = false
requires_confirmation = false

[[tools]]
name = "plan_read"
title = "Plan Read"
description = "Return a plan's status and workspace Markdown file location."
observe = false
requires_confirmation = false

[[tools]]
name = "plan_finalize"
title = "Plan Finalize"
description = "Finalize a workspace-backed plan."
observe = false
requires_confirmation = true

[[tools]]
name = "plan_list"
title = "Plan List"
description = "List draft and finalized plans stored in the workspace."
observe = false
requires_confirmation = false

[[skills]]
name = "plan"
title = "Plan First"
description = "Draft a step-by-step plan and wait for confirmation before executing."
body = "Before doing any work: draft a step-by-step plan using the planning tools ({tools}), present it to me, and wait for my explicit confirmation before executing."
tools = ["plan_start", "plan_update", "plan_read", "plan_finalize", "plan_list"]
phase = "composer"
